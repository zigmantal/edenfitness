      --text-body: #2E1B2B;
      --text-muted: #6B4A63;
      --bg-dark: #322F56;
      --text-on-dark: #FFFFFF;
      --text-on-dark-muted: rgba(255, 255, 255, 0.78);
      --border-on-dark: rgba(255, 255, 255, 0.14);
      --name-highlight-start: #E8B4C8;
      --name-highlight-end: #F2A6A0;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-main: 'Heebo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-main); background-color: var(--bg-main); color: var(--text-body); line-height: 1.6; overflow-x: hidden; direction: rtl; text-align: right; }
    h1, h2 { font-family: var(--font-display); color: var(--text-heading); line-height: 1.25; font-weight: 700; }
    .container { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px; }
    :focus-visible { outline: 3px solid rgba(233, 79, 112, 0.55); outline-offset: 2px; }

    .navbar { position: sticky; top: 0; z-index: 50; background: var(--bg-dark); border-bottom: 1px solid var(--border-on-dark); padding: 10px 0; }
    .navbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .navbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-on-dark); }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--color-accent), var(--color-secondary)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; color: #fff; box-shadow: 0 4px 12px var(--color-accent-glow); }

    .brand-name { font-size: 1.15rem; font-weight: 800; color: var(--text-on-dark); }
    .brand-sub { font-size: 0.75rem; color: var(--name-highlight-start); font-weight: 500; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-on-dark); text-decoration: none; font-size: 0.9rem; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-full); background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-on-dark); transition: all 0.2s ease; }
    .back-link:hover { background: rgba(255, 255, 255, 0.18); color: var(--name-highlight-start); border-color: var(--name-highlight-start); }

    .page-hero { background: var(--bg-dark); padding: 40px 0 56px; text-align: center; }
    .page-hero h1 { color: var(--text-on-dark); font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .page-hero h1 span { background: linear-gradient(135deg, var(--name-highlight-start), var(--name-highlight-end)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .page-hero p { color: var(--text-on-dark-muted); max-width: 520px; margin: 12px auto 0; font-size: 1.02rem; line-height: 1.7; }

    .form-wrap { margin-top: -28px; padding-bottom: 72px; position: relative; }
    .form-frame-card { background: #fff; border: 1px solid rgba(201, 127, 160, 0.3); border-radius: var(--radius-lg); box-shadow: 0 20px 40px -10px rgba(46, 27, 43, 0.08); overflow: hidden; }
    .form-frame-card iframe { display: block; width: 100%; min-width: 100%; max-width: 100%; height: 1600px; border: 0; }
    
    .mobile-open-card { display: none; text-align: center; padding: 32px 22px; background: var(--bg-card); border: 1px solid rgba(201, 127, 160, 0.3); border-radius: var(--radius-lg); box-shadow: 0 20px 40px -10px rgba(46, 27, 43, 0.08); }
    .mobile-open-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px 24px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-accent) 0%, #D63A5E 100%); color: #fff; font-weight: 700; font-size: 1.08rem; text-decoration: none; box-shadow: 0 4px 20px var(--color-accent-glow); }
    
    @media (max-width: 699px) {
      .mobile-open-card { display: block; }
      .desktop-embed { display: none; }
    }
    
    .form-fallback { text-align: center; font-size: 0.92rem; color: var(--text-muted); margin-top: 18px; line-height: 1.8; }
    .form-fallback a { color: var(--color-accent-dark); font-weight: 700; text-decoration: none; }
    .form-fallback a:hover { text-decoration: underline; }

    .site-footer { background: #F3DBE0; border-top: 1px solid rgba(201, 127, 160, 0.3); padding: 28px 0; text-align: center; font-size: 0.88rem; color: var(--text-muted); }
    .site-footer a { color: var(--color-accent-dark); font-weight: 600; text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }

    @media (min-width: 640px) { .page-hero h1 { font-size: 2.6rem; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
